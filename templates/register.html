<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="page-container">
        <div class="logo-container">
            <div class="logo-frame">
                <a href="{{ url_for('login_page') }}" class="logo-link">
                    <img src="{{ url_for('static', filename='images/Copilot_20260809_130103.png') }}" alt="ContactHub-Logo" class="logo-img">
                </a>
            </div>
            <p class="welcome-text">ContactHub helps you manage and organize your contacts effortlessly.</p>
        </div>

        <div class="main-container">
            <h2 class="welcome-message2">Create your account and start connecting.</h2>

            <form method="POST" class="register-form">
                <div class="register-form-row">                
                <label class="label"for="username">Username</label>
                <input class="input"type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="register-form-row">
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="register-form-row">
                <label class="label" for="phone">Phone</label>
                <input class="input" type="tel" id="phone" name="phone" placeholder="Phone" required>
                </div>
                <div class="register-form-row">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="register-form-row">
                <label class="label" for="address">Address</label>
                <input class="input" type="text" id="address" name="address" placeholder="Address" required>
                </div>
                
                <div class="button-group">
                <button type ="submit" class="register-btn">REGISTER</button>
                <a href="{{ url_for('login_page') }}" class="btn back-to-login-btn">BACK TO LOGIN</a>
                </div>
            </form>   
       </div>
    </iv>
</body>
</html>
